<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Uso: <head th:replace="~{fragments/layout :: head('Título')}"></head> -->
<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · UVenta'">UVenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/uventa.css}">
  <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
</head>

<!-- Uso: <nav th:replace="~{fragments/layout :: navbar}"></nav> -->
<nav th:fragment="navbar" class="navbar sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4" th:href="@{/}">
      <img th:src="@{/img/logo.svg}" width="36" height="36" alt=""> UVenta
    </a>
    <div class="d-flex align-items-center gap-2">
      <th:block th:if="${nombreUsuario != null}">
        <span class="small d-none d-sm-inline" th:text="'Hola, ' + ${nombreUsuario}">Hola</span>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button type="submit" class="btn btn-outline-secondary btn-sm">Salir</button>
        </form>
      </th:block>
      <th:block th:if="${nombreUsuario == null}">
        <a class="btn btn-link" th:href="@{/login}">Entrar</a>
        <a class="btn btn-primary btn-sm" th:href="@{/registro}">Crear cuenta</a>
      </th:block>
    </div>
  </div>
</nav>

<!-- Uso: <th:block th:replace="~{fragments/layout :: scripts}"></th:block> -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
