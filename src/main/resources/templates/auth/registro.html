<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 560px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 fw-bold">Crea tu cuenta</h1>
      <p class="text-secondary">Usa tu correo institucional. Te enviaremos un código para confirmarlo.</p>

      <form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
        <div class="row g-3">
          <div class="col-sm-6">
            <label for="nombre" class="form-label fw-semibold">Nombre</label>
            <input id="nombre" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid" autocomplete="given-name">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
          </div>
          <div class="col-sm-6">
            <label for="apellidos" class="form-label fw-semibold">Apellidos</label>
            <input id="apellidos" class="form-control" th:field="*{apellidos}" th:errorclass="is-invalid" autocomplete="family-name">
            <div class="invalid-feedback" th:errors="*{apellidos}"></div>
          </div>

          <div class="col-12">
            <label for="correo" class="form-label fw-semibold">Correo institucional</label>
            <input id="correo" type="email" class="form-control" th:field="*{correo}" th:errorclass="is-invalid"
                   placeholder="zS12345678@estudiantes.uv.mx" autocomplete="email">
            <div class="invalid-feedback" th:errors="*{correo}"></div>
            <div id="deteccion" class="form-text text-success fw-semibold" aria-live="polite"></div>
          </div>

          <div class="col-12" id="bloque-carrera">
            <label for="idCarrera" class="form-label fw-semibold">Carrera</label>
            <select id="idCarrera" class="form-select" th:field="*{idCarrera}" th:errorclass="is-invalid">
              <option value="">Elige tu carrera</option>
              <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{idCarrera}"></div>
          </div>

          <div class="col-sm-6" id="bloque-egreso" hidden>
            <label for="anioEgreso" class="form-label fw-semibold">Año de egreso</label>
            <select id="anioEgreso" class="form-select" th:field="*{anioEgreso}" th:errorclass="is-invalid">
              <option value="">Elige el año</option>
              <option th:each="a : ${anios}" th:value="${a}" th:text="${a}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{anioEgreso}"></div>
          </div>

          <div class="col-sm-6">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <input id="password" type="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid" autocomplete="new-password">
            <div class="invalid-feedback" th:errors="*{password}"></div>
            <div class="form-text">Mínimo 8 caracteres.</div>
          </div>
          <div class="col-sm-6">
            <label for="confirmarPassword" class="form-label fw-semibold">Repite la contraseña</label>
            <input id="confirmarPassword" type="password" class="form-control" th:field="*{confirmarPassword}" th:errorclass="is-invalid" autocomplete="new-password">
            <div class="invalid-feedback" th:errors="*{confirmarPassword}"></div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-4">Crear cuenta y enviar código</button>
      </form>
      <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a th:href="@{/login}" class="fw-bold">Entra aquí</a></p>
    </div>
  </div>
</main>
<script>
  // Solo ayuda visual: el servidor vuelve a deducir y validar todo a partir del correo.
  const DOM = { est: 'estudiantes.uv.mx', egr: 'egresados.uv.mx', per: 'uv.mx' };
  const correo = document.getElementById('correo');
  const bloqueCarrera = document.getElementById('bloque-carrera');
  const bloqueEgreso = document.getElementById('bloque-egreso');
  const deteccion = document.getElementById('deteccion');

  function ajustar() {
    const v = correo.value.trim().toLowerCase();
    const at = v.lastIndexOf('@');
    const local = at > 0 ? v.slice(0, at) : '';
    const dominio = at > 0 ? v.slice(at + 1) : '';
    const esEst = dominio === DOM.est, esEgr = dominio === DOM.egr, esPer = dominio === DOM.per;

    bloqueEgreso.hidden = !esEgr;   // año de egreso: solo egresados
    bloqueCarrera.hidden = esPer;   // el personal de la UV no elige carrera

    if (esEst && /^z[a-z]?\d{6,9}$/.test(local)) {
      deteccion.textContent = 'Estudiante · matrícula ' + local.slice(1).toUpperCase();
    } else if (esEst) {
      deteccion.textContent = '';
    } else if (esEgr) {
      deteccion.textContent = 'Egresado(a) de la UV';
    } else if (esPer) {
      deteccion.textContent = 'Personal de la UV';
    } else {
      deteccion.textContent = '';
    }
  }
  correo.addEventListener('input', ajustar);
  ajustar();
</script>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
