<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mensajes')}"></head>
<body class="has-tabbar">
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-3">
  <div class="uv-chat">
    <aside class="uv-chat__lista">
      <th:block th:replace="~{chat/fragmentos :: lista}"></th:block>
    </aside>
    <section class="uv-chat__vacio d-none d-lg-flex">
      <i class="bi bi-chat-dots"></i>
      <h2 class="h5 mt-2">Elige una conversación</h2>
      <p class="uv-muted mb-0">Aquí acuerdas el precio y el lugar de entrega con la otra persona.</p>
    </section>
  </div>
</main>

<nav th:replace="~{fragments/layout :: tabbar('chat')}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
