spring.application.name=uventa

# conexion a postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/uventa
spring.datasource.username=marvin
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver

#hibernate valida las entidades y genera las tablas
#flyway se encarga de crear y actualizar el esquema
spring.jpa.hibernate.ddl-auto=validate

#consultas sql en la consola durante desarrollo 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#migraciones sql
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#no expongas errores internos al usuario final
server.error.include-message=never

spring.jpa.open-in-view=false