spring.application.name=uventa

# conexion a postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/uventa
spring.datasource.username=marvin
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver

#hibernate valida las entidades y genera las tablas
#flyway se encarga de crear y actualizar el esquema
spring.jpa.hibernate.ddl-auto=validate

#consultas sql en la consola durante desarrollo 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#migraciones sql
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#no expongas errores internos al usuario final
server.error.include-message=never

spring.jpa.open-in-view=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username = ${UVENTA_MAIL_USERNAME}
spring.mail.password = ${UVENTA_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.security.oauth2.client.registration.azure.provider=azure
spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.azure.user-name-attribute=email
